apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockserver
  labels:
    app: mockserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockserver
  template:
    metadata:
      labels:
        app: mockserver
    spec:
      # The mockserver image runs as gcr.io/distroless/java17:nonroot (uid/gid 65532). fsGroup would
      # normally make a PVC's files group-writable by that uid, but kind's default StorageClass
      # (rancher.io/local-path) provisions hostPath-backed volumes, and Kubernetes does not apply
      # fsGroup ownership management to hostPath volumes - confirmed by inspection against the running
      # cluster (the file stayed root:root, mode 644, even with fsGroup set). Kept here anyway since it's
      # free and helps on real CSI-backed clusters; the init container's explicit chmod below is what
      # actually makes this work here.
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: seed-persisted-expectations
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/persistedExpectations.json ]; then
                echo "Seeding /data/persistedExpectations.json from the catch-all ConfigMap..."
                cp /config/initializerJson.json /data/persistedExpectations.json
              else
                echo "/data/persistedExpectations.json already present, leaving it alone."
              fi
              chmod 666 /data/persistedExpectations.json
          volumeMounts:
            - name: init-config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: mockserver
          image: mockserver/mockserver:5.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MOCKSERVER_SERVER_PORT
              value: "1080"
            - name: MOCKSERVER_INITIALIZATION_JSON_PATH
              value: "/data/persistedExpectations.json"
            - name: MOCKSERVER_PERSIST_EXPECTATIONS
              value: "true"
            - name: MOCKSERVER_PERSISTED_EXPECTATIONS_PATH
              value: "/data/persistedExpectations.json"
            - name: MOCKSERVER_LOG_LEVEL
              value: "INFO"
          ports:
            - containerPort: 1080
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 1080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-config
          configMap:
            name: mockserver-init
        - name: data
          persistentVolumeClaim:
            claimName: mockserver-data
