apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mockserver-poc

resources:
  - ../../base
  - mockserver-deployment.yaml
  - mockserver-service.yaml
  - mockserver-configmap.yaml
  - mockserver-pvc.yaml
  - backend-public-deployment.yaml
  - backend-public-service.yaml
  - backend-private-deployment.yaml
  - backend-private-service.yaml
  - mockserver-public-deployment.yaml
  - mockserver-public-service.yaml
  - mockserver-public-configmap.yaml
  - mockserver-public-pvc.yaml
  - mockserver-private-deployment.yaml
  - mockserver-private-service.yaml
  - mockserver-private-configmap.yaml
  - mockserver-private-pvc.yaml
  - mock-ui-deployment.yaml
  - mock-ui-service.yaml

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: alb-ingress
