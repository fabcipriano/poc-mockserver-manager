apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-ui
  labels:
    app: mock-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-ui
  template:
    metadata:
      labels:
        app: mock-ui
    spec:
      containers:
        - name: mock-ui
          image: mockserver-poc/mock-ui:local
          imagePullPolicy: IfNotPresent
          env:
            # One entry per configured MockServer instance (id/label/url) - see
            # design.md's "Configuration shape" decision. Adding, removing, or repointing a
            # target only requires editing this value and restarting the pod, no rebuild.
            - name: MOCKSERVER_TARGETS
              value: >-
                [{"id":"public","label":"Gateway Public","url":"http://mockserver-public"},
                {"id":"private","label":"Gateway Private","url":"http://mockserver-private"},
                {"id":"product","label":"Gateway Product","url":"http://mockserver"}]
            # Recent Requests page size, live-tail poll cadence, and SSE heartbeat cadence -
            # values below match mock-ui's built-in defaults, set explicitly so this manifest
            # doubles as a working example of every tunable a migration needs to carry over.
            - name: REQUEST_HISTORY_LIMIT
              value: "40"
            - name: REQUEST_STREAM_POLL_SECONDS
              value: "1"
            - name: HEARTBEAT_INTERVAL_SECONDS
              value: "15"
            # Recent Requests history storage: how many requests per target mock-ui keeps in its
            # own local SQLite file before pruning the oldest, and where that file lives. Local/
            # ephemeral on purpose - no PVC, since history isn't expected to survive a restart or
            # reschedule, only to stay reliable while mock-ui is running. See README's "Recent
            # Requests history storage" section and design.md in
            # openspec/changes/persist-recent-requests-history-sqlite.
            - name: REQUEST_HISTORY_RETENTION_ROWS
              value: "620000"
            - name: REQUEST_HISTORY_DATA_DIR
              value: "/tmp/mock-ui-request-history"
            # Enables the AI Mock Generator page, backed by AWS Bedrock - see README's "Configuring
            # AI mock generation" section. BEDROCK_MODEL_ID/AWS_REGION are plain config, not
            # secrets. mock-ui fails open (not closed) when BEDROCK_MODEL_ID is unset - see
            # design.md in openspec/changes/add-llm-mock-generation.
            # Cross-region inference profile ID, not the bare foundation model ID - this model
            # only supports INFERENCE_PROFILE invocation on Bedrock (confirmed against a real
            # account: the bare "anthropic.claude-sonnet-4-5-20250929-v1:0" model ID fails with
            # "on-demand throughput isn't supported" - see design.md's inference-profile risk).
            - name: BEDROCK_MODEL_ID
              value: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
            - name: AWS_REGION
              value: "us-east-1"
            # AWS credentials for the Bedrock call. Prefer an IAM role (IRSA on EKS, or an
            # instance profile) instead of these - that needs no env vars at all, since boto3
            # picks up role credentials automatically. These two are this POC's fallback for a
            # local cluster with no such role: deliberately not backed by a committed Secret
            # manifest - create the mock-ui-aws-credentials Secret out of band so a real key pair
            # is never something `git add` can pick up. `optional: true` means a cluster with no
            # such Secret (e.g. one that does have an IAM role instead) still deploys cleanly.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mock-ui-aws-credentials
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mock-ui-aws-credentials
                  key: secret-access-key
                  optional: true
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /mock-ui/healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
