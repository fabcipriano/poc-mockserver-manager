apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-ingress
spec:
  rules:
    - http:
        paths:
          - path: /mock-ui
            pathType: Prefix
            backend:
              service:
                name: mock-ui
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mockserver
                port:
                  number: 80
