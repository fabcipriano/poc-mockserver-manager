apiVersion: v1
kind: ConfigMap
metadata:
  name: mockserver-private-init
data:
  initializerJson.json: |
    [
      {
        "httpRequest": {
          "path": "/.*"
        },
        "httpForward": {
          "host": "backend-private",
          "port": 80,
          "scheme": "HTTP"
        },
        "priority": 0
      }
    ]
